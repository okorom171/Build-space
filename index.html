<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        font-family: Arial, Helvetica, sans-serif;
      }

      :root {
        --text-small: 14px;
        --font-large: 42px;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;
      }

      .card {
        position: relative;
        max-width: 300px;
        width: 90%;
        /* height: 350px; */
        /* margin: 150px 400px 150px 500px; */
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 2px 2px 2px 2px lightgray;
      }

      span {
        position: absolute;
        background-color: rgb(205, 38, 8);
        color: white;
        font-size: var(--small);
        text-align: center;
        top: 5px;
        left: 5px;
        padding: 3px 15px;
        border-radius: 5px;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
        /* border-radius: 5px; */
      }

      .card > div {
        padding: 1rem;
      }

      button {
        width: 100%;
        height: 40px;
        color: white;
        background-color: rgb(205, 38, 8);
        border: none;
        border-radius: 4px;
        font-size:var(--text-small);
        font-weight: 600;
        /* margin-left: 13px; */
        /* margin-top: 10px; */
      }

      /* h4 {
        /* margin: 8px 0px 0px 10px; */
      /* } */ */
      p {
        /* margin: 10px 0px 0px 10px; */
        font-size:var(--text-small);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span>Sale</span>
      <!-- product image -->
      <img src="./media/images.jpg" alt="Burger" />
      <!-- product description -->
      <div>
        <h4>Cheese Burger</h4>
        <p>$49.99</p>
        <button>Add to cart</button>
      </div>
    </div>
  </body>
</html>
